<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>To-Do List</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #273449;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dark: #0ea5e9;
    --danger: #f87171;
    --success: #4ade80;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    font-size: 18px;
    min-height: 100vh;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 720px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .counter {
    margin-top: 10px;
    font-size: 1.15rem;
    color: var(--muted);
  }
  .counter b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  #task-input {
    flex: 1;
    padding: 14px 16px;
    font-size: 1.1rem;
    background: var(--card);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  #task-input:focus { border-color: var(--accent); }
  #task-input::placeholder { color: var(--muted); }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button:active { transform: scale(0.97); }
  .btn-add {
    background: var(--accent);
    color: #082032;
    white-space: nowrap;
  }
  .btn-add:hover { background: var(--accent-dark); }
  .btn-clear {
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    white-space: nowrap;
  }
  .btn-clear:hover { background: rgba(248,113,113,0.12); }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
  }
  .list-title {
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  ul {
    list-style: none;
  }
  li.task {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: background 0.2s, opacity 0.2s;
  }
  li.task:hover { background: var(--card-hover); }
  li.task.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .check {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    color: transparent;
    transition: all 0.2s;
  }
  .task.done .check {
    background: var(--success);
    border-color: var(--success);
    color: #053b1c;
  }
  .task-text {
    flex: 1;
    font-size: 1.15rem;
    word-break: break-word;
  }
  .del {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .del:hover { background: rgba(248,113,113,0.15); color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 1.1rem;
  }
  /* 投影 / 手機：放大關鍵數字 */
  @media (min-width: 900px) {
    h1 { font-size: 2.6rem; }
    .counter { font-size: 1.4rem; }
    #task-input, .task-text { font-size: 1.3rem; }
    .btn-add, .btn-clear { font-size: 1.15rem; padding: 14px 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>To-Do List</h1>
    <div class="counter">未完成 <b id="unfinished">0</b> ／ 總數 <b id="total">0</b></div>
  </header>

  <div class="input-row">
    <input id="task-input" type="text" placeholder="輸入待辦事項，按 Enter 新增" autocomplete="off">
    <button class="btn-add" id="btn-add">新增</button>
  </div>

  <div class="toolbar">
    <span class="list-title">待辦事項</span>
    <button class="btn-clear" id="btn-clear">清除已完成</button>
  </div>

  <ul id="task-list"></ul>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "todo.tasks.v1";
  const input   = document.getElementById("task-input");
  const list    = document.getElementById("task-list");
  const btnAdd  = document.getElementById("btn-add");
  const btnClear= document.getElementById("btn-clear");
  const unfinishedEl = document.getElementById("unfinished");
  const totalEl = document.getElementById("total");

  // ---------- state ----------
  let tasks = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.warn("localStorage 寫入失敗：", e);
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- render ----------
  function render() {
    list.innerHTML = "";

    if (tasks.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "尚無待辦事項，新增一項吧！";
      list.appendChild(empty);
    } else {
      tasks.forEach(function (t) {
        const li = document.createElement("li");
        li.className = "task" + (t.done ? " done" : "");
        li.dataset.id = t.id;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", "標記完成");
        check.textContent = "✓";
        check.addEventListener("click", function () {
          t.done = !t.done;
          save();
          render();
        });

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = t.text;

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.setAttribute("aria-label", "刪除");
        del.textContent = "×";
        del.addEventListener("click", function () {
          tasks = tasks.filter(function (x) { return x.id !== t.id; });
          save();
          render();
        });

        li.appendChild(check);
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    updateCounter();
  }

  function updateCounter() {
    const total = tasks.length;
    const unfinished = tasks.filter(function (t) { return !t.done; }).length;
    totalEl.textContent = String(total);
    unfinishedEl.textContent = String(unfinished);
  }

  // ---------- actions ----------
  function addTask() {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    tasks.push({ id: uid(), text: text, done: false });
    input.value = "";
    save();
    render();
    input.focus();
  }

  function clearCompleted() {
    const before = tasks.length;
    tasks = tasks.filter(function (t) { return !t.done; });
    if (tasks.length !== before) {
      save();
      render();
    }
  }

  // ---------- events ----------
  btnAdd.addEventListener("click", addTask);
  btnClear.addEventListener("click", clearCompleted);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      addTask();
    }
  });

  render();
})();
</script>
</body>
</html>
